<section data-e2e="live-player">
  <div data-e2e="danmaku-item" data-message-id="douyin-native-overlay-1">
    <span>原生直播流文字</span>
  </div>
  <div
    class="bcp-douyin-dom-track"
    data-bcp-douyin-owned="true"
    data-message="[测试表情]直播流文字"
    data-message-id="douyin-overlay-1"
  >
    <div class="bcp-douyin-dom-barrage">
      <span class="bcp-douyin-dom-content">
        <img
          src="https://p3-webcast.douyinpic.com/img/webcast/fixture-douyin.png"
          alt="测试表情"
        >
        <span>直播流文字</span>
      </span>
    </div>
  </div>
</section>
<section data-e2e="chat-message-list">
  <article data-e2e="chat-message" data-message-id="douyin-chat-1">
    <span data-e2e="chat-message-user-name" data-user-id="fixture-user-douyin">测试用户丁</span>
    <span data-e2e="chat-message-text">
      <img
        src="https://p3-webcast.douyinpic.com/img/webcast/fixture-douyin.png"
        alt="测试表情"
      >
      <span>[测试表情]侧聊文字</span>
    </span>
  </article>
  <article data-e2e="chat-message" data-message-kind="gift" data-message-id="douyin-gift-1">
    <span data-e2e="chat-message-user-name">礼物测试用户</span>
    <span data-e2e="chat-message-text">送出测试礼物 x 1</span>
  </article>
  <article data-e2e="chat-message" data-message-kind="lottery" data-message-id="douyin-lottery-1">
    <span data-e2e="chat-message-text">左上角福袋测试口令</span>
  </article>
  <article
    data-e2e="chat-message"
    data-message-id="douyin-own-1"
    data-is-self="true"
  >
    <span data-e2e="chat-message-user-name">当前测试用户</span>
    <span data-e2e="chat-message-text">本人测试弹幕</span>
  </article>
  <textarea data-e2e="chat-room-input" placeholder="说点什么"></textarea>
  <button type="button" data-e2e="chat-room-send">发送</button>
</section>
